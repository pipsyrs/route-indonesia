server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 25M;

    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json gltf;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml model/gltf+json model/gltf-binary;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Uploaded files served from storage/app/public, never executed
    location ^~ /storage/ {
        alias /srv/storage/public/;
        try_files $uri =404;
        expires 7d;
        access_log off;

        location ~ /\. { deny all; }
        location ~* \.(php|phtml|phar|php\d)$ { deny all; }
    }

    location ^~ /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;

        location ~ /\. { deny all; }
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Fallback to Laravel for route-served assets (e.g. /livewire/livewire.js)
    location ~* \.(?:css|js|mjs|map|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|glb|gltf|bin|hdr|mp4|webm)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
}
