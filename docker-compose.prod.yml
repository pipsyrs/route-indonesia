services:
  app:
    build:
      target: prod
    image: routeindonesia-app:prod
    env_file: .env
    volumes: !override
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    restart: unless-stopped
    mem_limit: 256m

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      additional_contexts:
        app: service:app
    image: routeindonesia-nginx:prod
    volumes: !override
      - app-storage:/srv/storage:ro
    ports: !override
      - "127.0.0.1:8000:80"
    restart: unless-stopped
    mem_limit: 64m
